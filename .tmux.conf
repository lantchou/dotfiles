# fix escape delay
set -sg escape-time 0

# enable true colors
set -g default-terminal "screen-256color"

# allow scrolling with mouse
set -g mouse on

# change prefix
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# set index base to 1
set -g base-index 1
setw -g pane-base-index 1

# renumber windows upon window deletion
 set-option -g renumber-windows on

# unbind %
bind | split-window -h -c "#{pane_current_path}"

# Enable focus-events
set -g focus-events on

# unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind c
bind c new-window -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

unbind u
bind u last-window

unbind h
bind h selectp -L

unbind l
bind l selectp -R

unbind k
bind k selectp -U

unbind j
bind j selectp -D

unbind X
bind X confirm-before -p "kill windows right of current? (y/n)" \
  "run-shell '~/.tmux-kill-right.sh'"

# serve-wt: spin up api+web dev servers for current pane's worktree
# auto-detects branch from pane's cwd
unbind S
bind S run-shell 'cd "$(git -C "#{pane_current_path}" rev-parse --show-toplevel)" && bin/serve-wt'

# Claude Code agent status (pane option @agent_state, set by ~/.claude/hooks/tmux-agent-status.sh):
# the pane's top line takes the state's colour, with ┤ ├ in that colour around the state (bold) and
# the agent's branch. Colour is text only, no background: iTerm2 shows background colours
# translucent here, which washes them out. Only the top line: the side borders are shared with
# neighbouring panes, so they stay neutral. Without an agent (or idle), the normal border and the
# pane's folder.
# The coloured line is the pane's width in spaces turned into ─; tmux cuts off what doesn't fit.
set -g @agent-colour '#{?#{==:#{@agent_state},working},#61afef,#{?#{==:#{@agent_state},waiting},#e5c07b,#{?#{==:#{@agent_state},done},#98c379,#{?#{==:#{@agent_state},error},#e06c75,}}}}'
set -g pane-border-status top
set -g pane-border-format '#{?#{E:@agent-colour},#[fg=#{E:@agent-colour}]─┤ ●#[bold] #{@agent_state} #[default] #{@agent_label} #[fg=#{E:@agent-colour}]├#{s/ /─/:#{p-#{pane_width}:}}, #{?#{@agent_label},#{@agent_label},#{b:pane_current_path}} }'

# Copying in tmux lands on the macOS clipboard (OSC 52; iTerm2 must allow clipboard access).
set -g set-clipboard on
# Let programs reach iTerm2 directly through tmux (inline images, iTerm2's own escape codes).
set -g allow-passthrough on

# prefix + y: yazi in a new window, starting in the current pane's folder (closes on quit).
# Not a popup: yazi waits 5 s on quit in a popup (sxyazi/yazi#4361).
bind-key y new-window -c "#{pane_current_path}" yazi
